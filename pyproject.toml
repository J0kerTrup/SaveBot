[project]
name = "savebot"
version = "0.1.0"
description = "Telegram-бот: скачивает видео и звук по ссылкам TikTok и Instagram прямо в чате"
requires-python = ">=3.13"
dependencies = [
    "aiogram==3.31.0",
    "yt-dlp[default,curl-cffi]",
]

[tool.ruff]
line-length = 140

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
