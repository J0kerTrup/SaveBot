[project]
name = "savebot"
version = "0.1.0"
description = "Telegram-бот: скачивает видео, фото и музыку из TikTok, Instagram, YouTube и Spotify прямо в чате, файлы до 2 ГБ"
requires-python = ">=3.13"
dependencies = [
    "aiogram==3.31.0",
    "cryptg>=0.6.1",
    "instaloader>=4.16",
    "telethon>=1.46.0",
    "yt-dlp[default,curl-cffi]",
    "ytmusicapi>=1.12.4",
]

[tool.ruff]
line-length = 140

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
